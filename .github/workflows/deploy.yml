name: Deploy to DigitalOcean

on:
  push:
    branches:
      - main
    paths-ignore:
      - mobile/release.json

jobs:
  frontend_typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Type-check frontend
        run: npx tsc --noEmit

  deploy:
    needs: frontend_typecheck
    runs-on: ubuntu-latest
    concurrency:
      group: nutriscope-production-deploy
      cancel-in-progress: false

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          DB_ROOT_PASSWORD: ${{ secrets.DB_ROOT_PASSWORD }}
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          envs: DB_ROOT_PASSWORD
          command_timeout: 60m
          script: |
            set -eu
            cd Nutriscope
            # Read-only production preflight before fetching or replacing code/images.
            printf 'Preflight revision: '
            git rev-parse HEAD
            printf 'CPU cores: '
            nproc
            uptime
            free -h
            df -h .
            docker system df
            if command -v ss >/dev/null 2>&1; then ss -s; fi
            docker compose -f docker-compose.yml -f docker-compose.prod.yml ps
            for image in nutriscope-backend nutriscope-frontend; do
              docker image inspect --format '{{.RepoTags}} {{.Id}}' "$image" || true
            done
            printf 'Current local health HTTP status: '
            curl --silent --output /dev/null --write-out '%{http_code}\n' --max-time 10 http://127.0.0.1:8080/up || true
            for service in backend frontend mysql redis; do
              count=$(docker compose -f docker-compose.yml -f docker-compose.prod.yml logs --since 10m --no-color "$service" 2>&1 | grep -Eic '(^|[^a-z])(error|fatal|panic|unhealthy)([^a-z]|$)' || true)
              printf '%s recent error-like log lines: %s\n' "$service" "$count"
            done
            git fetch origin main
            git merge --ff-only origin/main
            export DOCKER_BUILDKIT=1
            export COMPOSE_DOCKER_CLI_BUILD=1
            export COMPOSE_PARALLEL_LIMIT=1
            # Requires backend/.env.production to exist on the server.
            # Base file provides mysql/redis; prod overlay adds backend/frontend.
            docker image inspect nutriscope-backend >/dev/null 2>&1 && docker tag nutriscope-backend nutriscope-backend:rollback || true
            docker image inspect nutriscope-frontend >/dev/null 2>&1 && docker tag nutriscope-frontend nutriscope-frontend:rollback || true
            docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile release build backend
            docker compose -f docker-compose.yml -f docker-compose.prod.yml build frontend
            docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile release run --rm backend_release
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans
            curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 http://127.0.0.1:8080/up >/dev/null
            docker compose -f docker-compose.yml -f docker-compose.prod.yml ps
