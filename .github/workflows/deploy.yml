name: Deploy to DigitalOcean

on:
  push:
    branches:
      - main
    paths-ignore:
      - mobile/release.json

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -eu
            cd Nutriscope
            git fetch origin main
            git reset --hard origin/main
            export DB_ROOT_PASSWORD=${{ secrets.DB_ROOT_PASSWORD }}
            export DOCKER_BUILDKIT=1
            export COMPOSE_DOCKER_CLI_BUILD=1
            # Requires backend/.env.production to exist on the server.
            # Base file provides mysql/redis; prod overlay adds backend/frontend.
            docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile release build
            docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile release run --rm backend_release
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
            docker image prune -f
