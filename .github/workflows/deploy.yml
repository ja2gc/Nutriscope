name: Deploy to DigitalOcean

on:
  push:
    branches:
      - main
    paths-ignore:
      - mobile/release.json

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          DB_ROOT_PASSWORD: ${{ secrets.DB_ROOT_PASSWORD }}
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          envs: DB_ROOT_PASSWORD
          command_timeout: 30m
          script: |
            set -eu
            cd Nutriscope
            git fetch origin main
            git merge --ff-only origin/main
            export DOCKER_BUILDKIT=1
            export COMPOSE_DOCKER_CLI_BUILD=1
            # Requires backend/.env.production to exist on the server.
            # Base file provides mysql/redis; prod overlay adds backend/frontend.
            docker image inspect nutriscope-backend >/dev/null 2>&1 && docker tag nutriscope-backend nutriscope-backend:rollback || true
            docker image inspect nutriscope-frontend >/dev/null 2>&1 && docker tag nutriscope-frontend nutriscope-frontend:rollback || true
            docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile release build
            docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile release run --rm backend_release
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
            curl --fail --silent --show-error --retry 12 --retry-delay 5 http://127.0.0.1:8080/up >/dev/null
            docker compose -f docker-compose.yml -f docker-compose.prod.yml ps
