name: Deploy to VPS

on:
  push:
    branches:
      - main
    paths-ignore:
      - mobile/release.json

defaults:
  run:
    shell: bash

jobs:
  backend_tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_MAINTENANCE_DRIVER: file
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: nutriscope_test
      DB_USERNAME: root
      DB_PASSWORD: testing
      DB_URL: ""
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      ANTHROPIC_API_KEY: test-key
      USDA_API_KEY: test-key
      BACKUP_ACCESS_KEY_ID: test-key
      BACKUP_SECRET_ACCESS_KEY: test-key
      BACKUP_BUCKET: test-backups
      BACKUP_ENDPOINT: http://127.0.0.1:1
      BACKUP_DEFAULT_REGION: us-east-1
      BACKUP_USE_PATH_STYLE_ENDPOINT: "true"
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: nutriscope_test
          MYSQL_ROOT_PASSWORD: testing
          MYSQL_ROOT_HOST: "%"
          TZ: UTC
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -ptesting"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_mysql, pdo_sqlite, mbstring, gd, intl, bcmath, zip, exif
          coverage: none
          tools: composer:v2

      - name: Install backend dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Verify disposable test database
        run: |
          php <<'PHP'
          <?php
          $pdo = new PDO('mysql:host=127.0.0.1;port=3306;dbname=nutriscope_test', 'root', 'testing');
          $identity = $pdo->query('SELECT DATABASE(), CURRENT_USER(), TIMESTAMPDIFF(SECOND, UTC_TIMESTAMP(), NOW())')->fetch(PDO::FETCH_NUM);
          if ($identity[0] !== 'nutriscope_test' || ! str_starts_with($identity[1], 'root@') || (int) $identity[2] !== 0) {
              throw new RuntimeException('Unexpected test database identity or timezone.');
          }
          PHP

      - name: Run full Laravel test suite
        run: vendor/bin/phpunit

  frontend_typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Type-check frontend
        run: npx tsc --noEmit

  deploy:
    needs: [frontend_typecheck, backend_tests]
    runs-on: ubuntu-latest
    concurrency:
      group: nutriscope-production-deploy
      cancel-in-progress: false

    steps:
      - name: Check out release source
        uses: actions/checkout@v5

      - name: Verify deployment configuration
        env:
          SSH_HOST_FINGERPRINT: ${{ secrets.DROPLET_HOST_FINGERPRINT }}
        run: |
          [[ "$SSH_HOST_FINGERPRINT" == SHA256:* ]] || {
            echo 'Set DROPLET_HOST_FINGERPRINT to the independently verified SSH host fingerprint.' >&2
            exit 1
          }

      - name: Test deployment failure paths
        env:
          DB_ROOT_PASSWORD: validation-only
          COMPOSE_DISABLE_ENV_FILE: "1"
        run: |
          bash ops/tests/deploy.test.sh
          docker compose --env-file backend/.env.production.example \
            -f docker-compose.yml -f docker-compose.prod.yml \
            -f ops/compose-validation.yml --profile release \
            config --no-env-resolution --quiet

      - name: Build images on runner
        run: |
          docker build --pull --label io.nutriscope.app=true \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag nutriscope-backend:latest backend
          docker build --pull --label io.nutriscope.app=true \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --build-arg LARAVEL_API_URL=http://backend/api \
            --tag nutriscope-frontend:latest frontend
          docker image save nutriscope-backend:latest nutriscope-frontend:latest | gzip -1 > images.tar.gz

      - name: Transfer images over verified SSH
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          fingerprint: ${{ secrets.DROPLET_HOST_FINGERPRINT }}
          source: images.tar.gz
          target: Nutriscope/.deploy
          overwrite: true
          timeout: 120s
          command_timeout: 20m

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          DB_ROOT_PASSWORD: ${{ secrets.DB_ROOT_PASSWORD }}
          RELEASE_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          fingerprint: ${{ secrets.DROPLET_HOST_FINGERPRINT }}
          envs: DB_ROOT_PASSWORD,RELEASE_SHA
          command_timeout: 30m
          script: |
            set -eu
            cd Nutriscope
            trap 'rm -f -- .deploy/images.tar.gz' EXIT
            git fetch origin main
            test "$(git rev-parse origin/main)" = "$RELEASE_SHA"
            git merge --ff-only "$RELEASE_SHA"
            test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
            bash ops/deploy.sh "$RELEASE_SHA"
