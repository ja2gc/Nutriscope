name: Publish FSS Android release

on:
  push:
    branches:
      - main
    paths:
      - mobile/release.json
  workflow_dispatch:
    inputs:
      artifact_url:
        description: Signed EAS APK artifact URL
        required: true
        type: string
      version:
        description: App version (for example 1.2.1)
        required: true
        type: string
      version_code:
        description: Android version code
        required: true
        type: string
      sha256:
        description: Lowercase APK SHA-256
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release request
        if: github.event_name == 'push'
        uses: actions/checkout@v5

      - name: Read release request
        if: github.event_name == 'push'
        id: release
        run: |
          jq -e '.artifact_url | type == "string" and test("^https://[^\\r\\n]+$")' mobile/release.json >/dev/null
          jq -e '.version | type == "string" and test("^[0-9]+(\\.[0-9]+)*$")' mobile/release.json >/dev/null
          jq -e '.version_code | type == "number" and floor == . and . > 0' mobile/release.json >/dev/null
          jq -e '.sha256 | type == "string" and test("^[0-9a-f]{64}$")' mobile/release.json >/dev/null
          {
            echo "artifact_url=$(jq -r .artifact_url mobile/release.json)"
            echo "version=$(jq -r .version mobile/release.json)"
            echo "version_code=$(jq -r .version_code mobile/release.json)"
            echo "sha256=$(jq -r .sha256 mobile/release.json)"
          } >> "$GITHUB_OUTPUT"

      - name: Download and verify signed APK
        env:
          APK_URL: ${{ github.event_name == 'push' && steps.release.outputs.artifact_url || inputs.artifact_url }}
          VERSION: ${{ github.event_name == 'push' && steps.release.outputs.version || inputs.version }}
          VERSION_CODE: ${{ github.event_name == 'push' && steps.release.outputs.version_code || inputs.version_code }}
          SHA256: ${{ github.event_name == 'push' && steps.release.outputs.sha256 || inputs.sha256 }}
        run: |
          set -euo pipefail
          case "$VERSION" in ''|*[!0-9.]*) exit 2 ;; esac
          case "$VERSION_CODE" in ''|*[!0-9]*) exit 2 ;; esac
          case "$SHA256" in *[!0-9a-f]*|'') exit 2 ;; esac
          [ "${#SHA256}" -eq 64 ] || exit 2

          mkdir -p release-upload
          curl --proto '=https' --tlsv1.2 --connect-timeout 30 --max-time 900 \
            --retry 3 --retry-delay 5 --retry-all-errors -fsSL \
            -o release-upload/nutriscope-fss.apk -- "$APK_URL"
          echo "$SHA256  release-upload/nutriscope-fss.apk" | sha256sum -c -

          published_at=$(date --iso-8601=seconds)
          printf '{"version":"%s","version_code":%s,"download_url":"https://nutriscope.live/downloads/nutriscope-fss.apk","sha256":"%s","published_at":"%s"}\n' \
            "$VERSION" "$VERSION_CODE" "$SHA256" "$published_at" \
            > release-upload/nutriscope-fss.json
          split -b 8M -d -a 3 release-upload/nutriscope-fss.apk \
            release-upload/nutriscope-fss.apk.part-

      - name: Prepare isolated server staging directory
        uses: appleboy/ssh-action@v1
        env:
          UPLOAD_DIR: /tmp/nutriscope-release-${{ github.run_id }}
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          envs: UPLOAD_DIR
          command_timeout: 2m
          script: |
            set -eu
            case "$UPLOAD_DIR" in /tmp/nutriscope-release-[0-9]*) ;; *) exit 2 ;; esac
            install -d -m 0700 "$UPLOAD_DIR"
            rm -f "$UPLOAD_DIR"/nutriscope-fss.apk.part-* \
              "$UPLOAD_DIR/nutriscope-fss.apk" "$UPLOAD_DIR/nutriscope-fss.json"

      - name: Upload verified release in retryable chunks
        env:
          SSH_HOST: ${{ secrets.DROPLET_HOST }}
          SSH_USER: ${{ secrets.DROPLET_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.DROPLET_SSH_KEY }}
          UPLOAD_DIR: /tmp/nutriscope-release-${{ github.run_id }}
        run: |
          set -euo pipefail
          key_file=$(mktemp)
          known_hosts=$(mktemp)
          trap 'rm -f "$key_file" "$known_hosts"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key_file"
          chmod 0600 "$key_file"
          ssh-keyscan -T 30 -H "$SSH_HOST" > "$known_hosts"

          for file in release-upload/nutriscope-fss.apk.part-* release-upload/nutriscope-fss.json; do
            uploaded=0
            for attempt in 1 2 3 4 5; do
              if scp -q -i "$key_file" \
                -o BatchMode=yes -o ConnectTimeout=30 \
                -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
                -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known_hosts" \
                "$file" "$SSH_USER@$SSH_HOST:$UPLOAD_DIR/"; then
                uploaded=1
                break
              fi
              sleep $((attempt * 5))
            done
            [ "$uploaded" -eq 1 ] || exit 1
          done

      - name: Publish verified APK and update metadata
        uses: appleboy/ssh-action@v1
        env:
          SHA256: ${{ github.event_name == 'push' && steps.release.outputs.sha256 || inputs.sha256 }}
          UPLOAD_DIR: /tmp/nutriscope-release-${{ github.run_id }}
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          envs: SHA256,UPLOAD_DIR
          command_timeout: 5m
          script: |
            set -eu
            case "$SHA256" in *[!0-9a-f]*|'') exit 2 ;; esac
            [ "${#SHA256}" -eq 64 ] || exit 2

            release_dir=/var/www/nutriscope-downloads
            upload_dir="$UPLOAD_DIR"
            case "$upload_dir" in /tmp/nutriscope-release-[0-9]*) ;; *) exit 2 ;; esac
            trap 'rm -f "$upload_dir"/nutriscope-fss.apk.part-* "$upload_dir/nutriscope-fss.apk" "$upload_dir/nutriscope-fss.json"; rmdir "$upload_dir" 2>/dev/null || true' EXIT

            cat "$upload_dir"/nutriscope-fss.apk.part-* > "$upload_dir/nutriscope-fss.apk"
            echo "$SHA256  $upload_dir/nutriscope-fss.apk" | sha256sum -c -
            install -d -m 0755 "$release_dir"
            install -m 0644 "$upload_dir/nutriscope-fss.apk" "$release_dir/.nutriscope-fss.apk.new"
            mv -f "$release_dir/.nutriscope-fss.apk.new" "$release_dir/nutriscope-fss.apk"
            install -m 0644 "$upload_dir/nutriscope-fss.json" "$release_dir/.nutriscope-fss.json.new"
            mv -f "$release_dir/.nutriscope-fss.json.new" "$release_dir/nutriscope-fss.json"
