# Paste these locations inside the existing nutriscope.live HTTPS server block.
# They reuse the current nutriscope.live certificate and proxy mobile traffic
# directly to the Laravel backend published on 127.0.0.1:8080.

location = /mobile-api {
    return 308 /mobile-api/;
}

location /mobile-api/ {
    client_max_body_size 25M;

    proxy_pass         http://127.0.0.1:8080/;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
}

# Stable native-app release files. Replace the APK and JSON atomically for each release;
# /mobile-app and its QR code never change.
location = /downloads/nutriscope-fss.apk {
    alias /var/www/nutriscope-downloads/nutriscope-fss.apk;
    default_type application/vnd.android.package-archive;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-cache" always;
}

location = /downloads/nutriscope-fss.json {
    alias /var/www/nutriscope-downloads/nutriscope-fss.json;
    default_type application/json;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-store" always;
}
