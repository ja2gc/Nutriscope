# Paste these locations inside the existing nutriscope.live HTTPS server block.
# They reuse the current nutriscope.live certificate and proxy mobile traffic
# directly to the Laravel backend published on 127.0.0.1:8080.

location = /mobile-api {
    return 308 /mobile-api/;
}

location /mobile-api/ {
    client_max_body_size 25M;

    proxy_pass         http://127.0.0.1:8080/;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
}
