<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--surface-page); color: var(--text-body); }
  #root { padding: 22px; display: flex; flex-direction: column; gap: 18px; }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .lbl { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-muted); width: 100%; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/lucide@latest"></script>
<script type="text/babel">
  const { Button, IconButton, Card, Avatar, Logo } = window.NutriScopeDesignSystem_c4cce8;
  const Ico = ({ n }) => { const r = React.useRef(null); React.useEffect(() => { if (r.current) { r.current.innerHTML = `<i data-lucide="${n}"></i>`; lucide.createIcons({ attrs: { width: 18, height: 18 } }); } }, []); return <span ref={r} style={{display:'inline-flex'}} />; };

  function Demo() {
    return (
      <React.Fragment>
        <div className="row"><Logo /><div style={{width:24}} /><Logo variant="forest" collapsed={false} /></div>
        <div className="row"><span className="lbl">Variants</span>
          <Button variant="primary">Save Plan</Button>
          <Button variant="secondary">From Template</Button>
          <Button variant="ghost">Cancel</Button>
          <Button variant="accent">Publish</Button>
          <Button variant="danger">Delete</Button>
          <Button variant="primary" loading>Save</Button>
        </div>
        <div className="row"><span className="lbl">Sizes &amp; icon buttons</span>
          <Button size="sm">Small</Button>
          <Button size="md">Medium</Button>
          <Button size="lg">Large</Button>
          <IconButton aria-label="bell" tone="neutral"><Ico n="bell" /></IconButton>
          <IconButton aria-label="edit" tone="brand"><Ico n="pencil" /></IconButton>
          <IconButton aria-label="delete" tone="danger"><Ico n="trash-2" /></IconButton>
        </div>
        <div className="row" style={{alignItems:'stretch'}}>
          <Card padded style={{flex:1, display:'flex', alignItems:'center', gap:12}}>
            <Avatar name="Maria Santos" />
            <div>
              <div style={{fontWeight:700, color:'var(--text-strong)', fontSize:14}}>Maria Santos</div>
              <div style={{fontSize:11, fontWeight:800, color:'var(--brand-accent)', textTransform:'uppercase', letterSpacing:'0.08em'}}>RND · Dietitian</div>
            </div>
          </Card>
        </div>
      </React.Fragment>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
