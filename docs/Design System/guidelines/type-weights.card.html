<!-- @dsCard group="Type" viewport="700x150" name="Weights & Overlines" subtitle="400–800 weights; UPPERCASE wide-tracked overlines for labels." -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--surface-card); color: var(--text-strong); }
  .wrap { display: grid; grid-template-columns: 1.3fr 1fr; }
  .col { padding: 18px 22px; }
  .col + .col { border-left: 1px solid var(--border-subtle); }
  .weights { display: flex; flex-direction: column; gap: 7px; }
  .w { font-size: 21px; letter-spacing: -0.01em; }
  .wl { font-family: var(--font-mono); font-size: 10px; color: var(--text-faint); margin-left: 10px; }
  .ov-demo { display: flex; flex-direction: column; gap: 12px; margin-top: 2px; }
  .ov { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-muted); }
  .ov.brand { color: var(--brand-primary); }
  .ov.accent { color: var(--brand-accent); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="col">
      <div class="weights">
        <div><span class="w" style="font-weight:400">Regular</span><span class="wl">400</span></div>
        <div><span class="w" style="font-weight:500">Medium</span><span class="wl">500</span></div>
        <div><span class="w" style="font-weight:600">Semibold</span><span class="wl">600</span></div>
        <div><span class="w" style="font-weight:700">Bold</span><span class="wl">700</span></div>
        <div><span class="w" style="font-weight:800">Extrabold</span><span class="wl">800</span></div>
      </div>
    </div>
    <div class="col">
      <div class="ov-demo">
        <div class="ov">Clinical &amp; Operational Console</div>
        <div class="ov brand">Active Session</div>
        <div class="ov accent">RND · Dietitian</div>
      </div>
    </div>
  </div>
</body>
</html>
