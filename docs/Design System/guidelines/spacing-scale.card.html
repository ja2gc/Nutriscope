<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing Scale" subtitle="4px base step. Card inset = 20px (--space-5)." -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--surface-card); color: var(--text-body); }
  .row { display: flex; align-items: flex-end; gap: 18px; padding: 22px 22px 18px; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .bar { background: var(--green-500); border-radius: 3px; width: 100%; }
  .box { display: flex; align-items: flex-end; height: 64px; }
  .tok { font-family: var(--font-mono); font-size: 9px; color: var(--text-strong); font-weight: 600; }
  .px { font-family: var(--font-mono); font-size: 9px; color: var(--text-faint); }
</style>
</head>
<body>
  <div class="row" id="r"></div>
  <script>
    const steps = [['1',4],['2',8],['3',12],['4',16],['5',20],['6',24],['8',32],['10',40],['12',48]];
    document.getElementById('r').innerHTML = steps.map(([k,px]) => `
      <div class="item" style="width:${px}px">
        <div class="box"><div class="bar" style="height:${px}px"></div></div>
        <div class="tok">${k}</div><div class="px">${px}</div>
      </div>`).join('');
  </script>
</body>
</html>
