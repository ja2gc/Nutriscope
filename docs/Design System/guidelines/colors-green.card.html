<!-- @dsCard group="Colors" viewport="700x150" name="Brand Green — Primary" subtitle="The hero. Health, vitality, every primary action." -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--surface-card); color: var(--text-body); }
  .row { display: flex; gap: 0; padding: 18px 20px; }
  .sw { flex: 1; }
  .chip { height: 56px; border-radius: 0; }
  .row .sw:first-child .chip { border-radius: var(--radius-md) 0 0 var(--radius-md); }
  .row .sw:last-child .chip { border-radius: 0 var(--radius-md) var(--radius-md) 0; }
  .meta { padding: 8px 2px 0; }
  .tok { font-family: var(--font-mono); font-size: 10px; color: var(--text-strong); font-weight: 600; letter-spacing: -0.01em; }
  .hex { font-family: var(--font-mono); font-size: 9.5px; color: var(--text-faint); margin-top: 2px; }
  .star { color: var(--brand-primary); font-weight: 700; }
</style>
</head>
<body>
  <div class="row" id="r"></div>
  <script>
    const scale = [
      ['50','#ecfdf5'],['100','#d1fae5'],['200','#a7f3d0'],['300','#6ee7b7'],['400','#34d399'],
      ['500','#10b981'],['600','#059669'],['700','#047857'],['800','#065f46'],['900','#064e3b']
    ];
    document.getElementById('r').innerHTML = scale.map(([k,v]) => `
      <div class="sw">
        <div class="chip" style="background:${v}"></div>
        <div class="meta">
          <div class="tok">--green-${k}${k==='600'?' <span class="star">●</span>':''}</div>
          <div class="hex">${v}</div>
        </div>
      </div>`).join('');
  </script>
</body>
</html>
