[build]
builder = "nixpacks"

[deploy]
# Run database migrations as the platform's one-time release/pre-deploy command.
startCommand = "php artisan config:cache && php artisan route:cache && php artisan storage:link && php artisan serve --host=0.0.0.0 --port=$PORT"
healthcheckPath = "/up"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
