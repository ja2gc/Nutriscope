version: '3.8'

services:

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: nutriscope
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - nutriscope_net
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - nutriscope_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend/.env.production
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - nutriscope_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        LARAVEL_API_URL: http://backend/api
    restart: unless-stopped
    environment:
      LARAVEL_API_URL: http://backend/api
    depends_on:
      - backend
    networks:
      - nutriscope_net

volumes:
  mysql_data:
  redis_data:

networks:
  nutriscope_net:
    driver: bridge
