x-logging: &bounded-logging
    driver: local
    options:
      max-size: "10m"
      max-file: "3"

x-backend-common: &backend-common
    image: nutriscope-backend
    pull_policy: never
    mem_limit: 512m
    logging: *bounded-logging
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend/.env.production
    environment:
      MAIL_MAILER: "resend-api"
      ANTHROPIC_MODEL: "claude-haiku-5-5"
      LOG_CHANNEL: "stderr"
    volumes:
      - nutriscope_private_uploads:/var/www/html/storage/app/private-uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - nutriscope_net

services:
  mysql:
    mem_limit: 768m
    logging: *bounded-logging
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required for production}"
      MYSQL_ALLOW_EMPTY_PASSWORD: !reset null

  redis:
    mem_limit: 128m
    logging: *bounded-logging

  backend:
    <<: *backend-common
    mem_limit: 768m
    ports:
      - "127.0.0.1:8080:80"

  backend_worker:
    <<: *backend-common
    command: php artisan queue:work redis --queue=backups,default --sleep=3 --tries=3 --backoff=5 --timeout=1200 --max-time=3600

  backend_scheduler:
    <<: *backend-common
    mem_limit: 192m
    command: php artisan schedule:work

  backend_release:
    <<: *backend-common
    command: /usr/local/bin/docker-release.sh
    profiles:
      - release
    restart: "no"

  frontend:
    image: nutriscope-frontend
    pull_policy: never
    mem_limit: 384m
    logging: *bounded-logging
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        LARAVEL_API_URL: http://backend/api
    restart: unless-stopped
    environment:
      LARAVEL_API_URL: http://backend/api
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend
    networks:
      - nutriscope_net

volumes:
  nutriscope_private_uploads:
    name: nutriscope_private_uploads
    driver: local
