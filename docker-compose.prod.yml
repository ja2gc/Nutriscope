x-backend-common: &backend-common
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend/.env.production
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - nutriscope_net

services:
  backend:
    <<: *backend-common
    ports:
      - "127.0.0.1:8080:80"

  backend_worker:
    <<: *backend-common
    command: php artisan queue:work redis --queue=backups,default --sleep=3 --tries=3 --backoff=5 --timeout=900 --max-time=3600

  backend_scheduler:
    <<: *backend-common
    command: php artisan schedule:work

  backend_release:
    <<: *backend-common
    command: /usr/local/bin/docker-release.sh
    profiles:
      - release
    restart: "no"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        LARAVEL_API_URL: http://backend/api
    restart: unless-stopped
    environment:
      LARAVEL_API_URL: http://backend/api
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend
    networks:
      - nutriscope_net
