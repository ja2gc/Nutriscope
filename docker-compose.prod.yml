# Production overlay. Run merged with the base file:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# The base file provides mysql, redis, paddleocr, and omr; this overlay adds the
# application containers and publishes the frontend port for the host nginx.
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nutriscope_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env.production
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - nutriscope_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        LARAVEL_API_URL: http://backend/api
    container_name: nutriscope_frontend
    restart: unless-stopped
    environment:
      LARAVEL_API_URL: http://backend/api
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend
    networks:
      - nutriscope_net
